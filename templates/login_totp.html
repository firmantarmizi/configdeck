<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light dark"><title>Verify sign in · ConfigDeck</title><link rel="icon" type="image/svg+xml" href="/static/configdeck-logo.svg?v={{ crate::web::asset_version() }}"><link rel="stylesheet" href="/static/app.css?v={{ crate::web::asset_version() }}"><script src="/static/theme.js?v={{ crate::web::asset_version() }}"></script></head>
<body class="auth-body"><main class="auth-card"><div class="auth-brand"><img class="brand-logo" src="/static/configdeck-logo.svg?v={{ crate::web::asset_version() }}" alt=""><span><strong>ConfigDeck</strong><small>Configuration Management Platform</small></span></div><p class="eyebrow">Two-step verification</p><h1>Enter your code</h1><p>Enter the six-digit code from your authenticator to finish signing in. This step expires after five minutes.</p>
{% if !error.is_empty() %}<p class="notice danger" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/auth/totp/challenge"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Authenticator code<input name="code" type="text" inputmode="numeric" pattern="[0-9]{6}" minlength="6" maxlength="6" autocomplete="one-time-code" placeholder="6-digit code" required autofocus></label><button type="submit">Verify and sign in</button></form>
<form method="post" action="/auth/totp/cancel"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button type="submit" class="auth-cancel tertiary">Cancel sign in</button></form>
</main></body></html>
