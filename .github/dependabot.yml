version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      # Keep the compatible digest stack together, including major upgrades.
      rustcrypto-digest-stack:
        patterns:
          - hkdf
          - hmac
          - sha1
          - sha2
      rust-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # Review base-image and toolchain changes separately.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
