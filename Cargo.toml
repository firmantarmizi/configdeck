[package]
name = "configdeck"
version = "0.1.0"
authors = ["Firman Tarmizi"]
edition = "2024"
rust-version = "1.94"
license = "MIT"
description = "A lightweight, self-hosted environment configuration and change-management platform"
readme = "README.md"
repository = "https://github.com/firmantarmizi/configdeck"
keywords = ["configuration", "environment", "secrets", "devops"]
categories = ["config", "web-programming"]
publish = false

[dependencies]
anyhow = "1.0"
argon2 = { version = "0.5", features = ["std"] }
askama = "0.16"
axum = { version = "0.8", features = ["form", "http1", "json", "multipart", "tokio"] }
base64 = "0.23"
chacha20poly1305 = "0.10"
data-encoding = "2.9"
getrandom = "0.4"
hkdf = "0.13"
hmac = "0.13"
http = "1.3"
ipnet = "2.11"
percent-encoding = "2.3"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.11"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["derive", "macros", "migrate", "runtime-tokio", "sqlite"] }
subtle = "2.6"
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1.48", features = ["macros", "net", "rt-multi-thread", "signal"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["catch-panic", "limit", "request-id", "timeout", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1.18", features = ["v4"] }
zeroize = { version = "1.8", features = ["derive"] }

[dev-dependencies]
tempfile = "3.23"

[profile.release]
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
